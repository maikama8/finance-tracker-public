publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  fl_chart: ^1.3.1
  flutter_riverpod: ^3.5.0
  http: ^1.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
