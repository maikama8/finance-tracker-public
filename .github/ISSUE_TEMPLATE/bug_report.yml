name: Bug report
description: Something in Kobo does not do what it should.
title: ""
labels: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample
      description: A CSV row or a short description of the accounts and amounts. Leave out real account numbers.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
  - type: dropdown
    id: platform
    attributes:
      label: Where you ran it
      options:
        - Web
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
    validations:
      required: true
