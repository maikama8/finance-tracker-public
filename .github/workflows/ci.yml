name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: find lib test -name '*.dart' ! -name '*.g.dart' -print0 | xargs -0 dart format --set-exit-if-changed --output=none

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release
